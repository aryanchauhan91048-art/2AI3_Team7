<!DOCTYPE html>
<html>
<head>
    <title>Titanic Survival Predictor</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        input, select {
            width: 90%;
            padding: 8px;
            margin: 8px;
        }

        button {
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
        }

        .result {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Titanic Survival Predictor</h2>

    <form action="/predict" method="post">

        <select name="pclass">
            <option value="1">1st Class</option>
            <option value="2">2nd Class</option>
            <option value="3">3rd Class</option>
        </select>

        <input type="number" name="age" placeholder="Age" required>
        <input type="number" name="sibsp" placeholder="Siblings/Spouse" required>
        <input type="number" name="parch" placeholder="Parents/Children" required>
        <input type="number" name="fare" placeholder="Fare" step="0.01" required>

        <select name="sex">
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <select name="embarked">
            <option value="C">Cherbourg</option>
            <option value="Q">Queenstown</option>
            <option value="S">Southampton</option>
        </select>

        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
    <div class="result">
        {{ prediction }}
    </div>
    {% endif %}

</div>

</body>
</html>
