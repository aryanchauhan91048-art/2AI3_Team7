<!DOCTYPE html>
<html>
<head>
    <title>Titanic Survival Predictor</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5a67d8;
        }

        .result {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #444;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Titanic Survival Predictor</h1>

    <form action="/predict" method="post">

        <label>Passenger Class:</label>
        <select name="pclass">
            <option value="1">1 (Upper)</option>
            <option value="2">2 (Middle)</option>
            <option value="3">3 (Lower)</option>
        </select>

        <label>Age:</label>
        <input type="number" name="age" required>

        <label>SibSp:</label>
        <input type="number" name="sibsp" required>

        <label>Parch:</label>
        <input type="number" name="parch" required>

        <label>Fare:</label>
        <input type="number" name="fare" step="0.01" required>

        <label>Sex:</label>
        <select name="sex">
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <label>Embarked:</label>
        <select name="embarked">
            <option value="C">Cherbourg</option>
            <option value="Q">Queenstown</option>
            <option value="S">Southampton</option>
        </select>

        <button type="submit">Predict</button>
    </form>

    {% if prediction %}
    <div class="result">
        Prediction: {{ prediction }}
    </div>
    {% endif %}

</div>

</body>
</html>
